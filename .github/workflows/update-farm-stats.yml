name: Update farm statistics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Fetch GitHub statistics and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          username = "tyasnurkumala2"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "farm-statistics-workflow",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          user_request = urllib.request.Request(
              f"https://api.github.com/users/{username}", headers=headers
          )
          with urllib.request.urlopen(user_request) as response:
              public_repos = json.load(response)["public_repos"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """
          payload = json.dumps({"query": query, "variables": {"login": username}}).encode()
          graphql_request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(graphql_request) as response:
              result = json.load(response)

          if result.get("errors"):
              raise RuntimeError(result["errors"])

          contributions = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"]
          readme_path = "README.md"
          with open(readme_path, encoding="utf-8") as file:
              readme = file.read()

          replacement = (
              "<!-- FARM_STATS_START -->\n"
              f"**{public_repos} public repositories · {contributions} contributions in the last year**\n"
              "<!-- FARM_STATS_END -->"
          )
          updated, count = re.subn(
              r"<!-- FARM_STATS_START -->.*?<!-- FARM_STATS_END -->",
              replacement,
              readme,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError("Farm statistics markers were not found exactly once")

          with open(readme_path, "w", encoding="utf-8", newline="") as file:
              file.write(updated)
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update farm statistics"
            git push
          fi
